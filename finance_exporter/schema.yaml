$schema: http://json-schema.org/draft-07/schema#
$id: https://github.com/rdmcguire/finance-exporter/schema.yaml
title: finance-exporter config file schema
type: object
additionalProperties: false

required:
  - address
  - port
  - sources

properties:
  min_interval:
    title: Minimum Update Interval
    description: Minimum time between updates (in seconds). Defaults to 15.
    type: integer
    minimum: 1
  port:
    title: Listen Port
    description: Default port to listen on
    type: integer
  address:
    title: Listen Address
    description: Default IP tp listen on. 0.0.0.0 for all
    type: string
    format: ip-address
  metric_prefix:
    title: Metric Prefix
    description: String to prepend to all metric names
    anyOf:
      - type: string
      - type: "null"

  sources:
    title: List of data sources
    type: array
    items:
      $ref: "#/definitions/source"
    minItems: 1
    uniqueItems: true

definitions:

  source:
    type: object
    additionalProperties: false
    required:
      - name
      - plugin
      - interval
      - tickers
      - metrics
    properties:
      name:
        title: Name of data source
        type: string
      interval:
        title: Collection interval
        description: How long to wait between updates
        type: integer
      plugin:
        title: Data API Plugin
        description: Name of plugin to retrieve data. Allowed values are filled in from the plugin registry (includes/plugins).
        type: string
      api_key:
        title: API Key for plugin
        description: API Key, required for fred and alphavantage. May reference an environment variable, e.g. ${FRED_API_KEY}
        type: string
      curve:
        title: Treasury yield curve
        description: Which daily Treasury par yield curve to read (treasury plugin only). Defaults to nominal.
        type: string
        enum:
          - nominal
          - real
      tickers:
        title: Symbols to poll from this source
        description: Yahoo symbols, FRED series IDs, Treasury tenors (e.g. 10Y), or AlphaVantage symbols, depending on plugin
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      metrics:
        title: Definitions of metrics to retrieve from source
        description: Metric names must be unique across all sources
        type: object
        patternProperties:
          ^\w+$:
            $ref: "#/definitions/metric"
      labels:
        title: Labels to retrieve from source
        description: Name / Value pairs of labels where Value is the field to use from the API response to populate the label
        type: object
        patternProperties:
          ^\w+$:
            type: string
    allOf:
      - if:
          properties:
            plugin:
              enum: [fred, alphavantage]
        then:
          required:
            - api_key
      - if:
          not:
            properties:
              plugin:
                const: treasury
        then:
          not:
            required:
              - curve

  metric:
    title: Metric configuration
    description: Detail for metric to retrieve from source
    type: object
    additionalProperties: false
    required:
      - item
      - type
      - help
    properties:
      item:
        title: API Item
        description: Name of field from API response (e.g. pe_ratio)
        type: string
      type:
        title: Metric type
        description: Prometheus metric type. Quote fields are snapshots, so Counter is not offered.
        type: string
        enum:
          - Gauge
          - Summary
          - Histogram
      help:
        title: Help text
        type: string
      scale:
        title: Scale factor
        description: Multiplier applied to the value, e.g. 0.01 to convert a percent to a ratio
        type: number
